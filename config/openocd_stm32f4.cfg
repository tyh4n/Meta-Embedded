# ST-Link + STM32F4 OpenOCD configuration shared by macOS, Linux and Windows.
source [find interface/stlink.cfg]

set WORKAREASIZE 0x8000
transport select hla_swd

# Enable debug while the MCU is in low-power modes.
set ENABLE_LOW_POWER 1

# Stop watchdog counters while halted.
set STOP_WATCHDOG 1

# Use a speed supported by common ST-Link V2 probes.
adapter speed 1800

reset_config trst_only combined
set CONNECT_UNDER_RESET 0

source [find target/stm32f4x.cfg]
stm32f4x.cpu configure -rtos chibios
